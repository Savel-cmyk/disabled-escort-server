services:
  api:
    build:
      context: ./disabled-escort-server
      dockerfile: ./Dockerfile
    env_file:
      - .env
    container_name: disabled-escort-server
    ports:
      - "${ESCORT_SERVER_PORT}:8080"
    networks:
      - disabled-escort-net
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: [ "CMD", "sh", "-c", "curl --fail --silent http://localhost:${ESCORT_SERVER_PORT}/actuator/health | grep 'UP'" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: postgres
    env_file:
      - .env
    container_name: ${ESCORTDB_CONTAINER_NAME}
    environment:
      POSTGRES_USER: ${POSTGRESDB_USER}
      POSTGRES_PASSWORD: ${POSTGRESDB_PASSWORD}
      POSTGRES_DB: ${POSTGRESDB_ESCORT_NAME}
    volumes:
      - pg_data_escort:/var/lib/postgresql/data
    ports:
      - "${POSTGRESDB_ESCORT_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRESDB_USER} -d ${POSTGRESDB_ESCORT_NAME}'" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - disabled-escort-net
    restart: unless-stopped

networks:
  disabled-escort-net:
    driver: bridge

volumes:
  pg_data_escort: